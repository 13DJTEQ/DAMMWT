# CI caller for Node/TypeScript projects (incl. Hermes plugins).
# DAMMWT: typecheck → build → verify (Day N acceptance) until eslint/unit suite exist.
name: CI (Node)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
# Guard: skip only in the org template repo (no real project). Runs on DAMMWT.
jobs:
  call-ci:
    if: github.repository != '13DJTEQ/ci-cd-template'
    uses: ./.github/workflows/ci-reusable.yml
    with:
      stack: node
      node-version: "20"
      lint-command: "npm run typecheck"
      build-command: "npm run build"
      test-command: "npm run verify"
