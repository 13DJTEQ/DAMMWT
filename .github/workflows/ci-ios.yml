# CI caller for iOS projects (runs on macOS runners).
# Edit scheme/workspace names to match your Xcode project.
name: CI (iOS)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
# Guard: these callers only run in CONSUMER repos (which have a real project).
# The template repo itself has no project, so skip to avoid failing CI noise.
jobs:
  call-ci:
    if: github.repository != '13DJTEQ/ci-cd-template'
    uses: ./.github/workflows/ci-reusable.yml
    with:
      stack: ios
      xcode-version: "15.4"
      lint-command: "swiftlint"
      build-command: "xcodebuild -scheme MyApp -configuration Release build"
      test-command: "xcodebuild test -scheme MyApp -destination 'platform=iOS Simulator,name=iPhone 15'"
