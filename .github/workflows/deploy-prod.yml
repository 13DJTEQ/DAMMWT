# Deploy to production — fires on a version tag (v*) like staging,
# BUT is gated by the `prod` environment's required reviewer (manual approval).
# Flow: tag -> staging auto-deploys (prerelease) -> prod waits for human approval
# -> full GitHub Release + npm publish to GitHub Packages (@13djteq).
name: Deploy to Production
on:
  push:
    tags: [v*]
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  call-deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: prod
      deploy-command: "./scripts/deploy.sh prod ${{ github.ref_name }}"
    secrets: inherit
